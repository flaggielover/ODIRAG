worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 25m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_real_ip $odirag_real_ip {
        default $http_x_real_ip;
        '' $remote_addr;
    }

    map $http_x_forwarded_for $odirag_forwarded_for {
        default $http_x_forwarded_for;
        '' $remote_addr;
    }

    map $http_x_forwarded_proto $odirag_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # Docker service IPs can change during a rolling replacement. Keep the
    # upstream names resolvable after startup instead of pinning an old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream odirag_backend {
        zone odirag_backend 64k;
        server backend:8000 resolve;
        keepalive 32;
    }

    upstream odirag_frontend {
        zone odirag_frontend 64k;
        server frontend:80 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /health/live {
            access_log off;
            proxy_pass http://odirag_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $odirag_real_ip;
            proxy_set_header X-Forwarded-For $odirag_forwarded_for;
            proxy_set_header X-Forwarded-Proto $odirag_forwarded_proto;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }

        location = /health/ready {
            access_log off;
            proxy_pass http://odirag_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $odirag_real_ip;
            proxy_set_header X-Forwarded-For $odirag_forwarded_for;
            proxy_set_header X-Forwarded-Proto $odirag_forwarded_proto;
            proxy_connect_timeout 2s;
            proxy_read_timeout 8s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }

        location /api/ {
            proxy_pass http://odirag_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $odirag_real_ip;
            # Replace, rather than append, client-supplied forwarding chains.
            # The backend accepts this header only from the configured Nginx IP.
            proxy_set_header X-Forwarded-For $odirag_forwarded_for;
            proxy_set_header X-Forwarded-Proto $odirag_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://odirag_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $odirag_real_ip;
            proxy_set_header X-Forwarded-For $odirag_forwarded_for;
            proxy_set_header X-Forwarded-Proto $odirag_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
