name: "${MONITORING_COMPOSE_PROJECT_NAME:-odirag-monitoring}"

x-common: &common
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"

services:
  prometheus:
    <<: *common
    image: "${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.2}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      monitoring: {}
      app-private: {}
      management: {}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.20
    pids_limit: 100
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    <<: *common
    image: "${GRAFANA_IMAGE:-grafana/grafana:13.1.3}"
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-odirag-admin}"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:${GRAFANA_PORT:-3000}"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks:
      monitoring: {}
      management: {}
    depends_on:
      prometheus:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/log/grafana:size=16m,mode=0755
    cap_drop: [ALL]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.15
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  alertmanager:
    <<: *common
    image: "${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.33.1}"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND_ADDRESS:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      monitoring: {}
      management: {}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.04
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/bin/amtool", "check-config", "/etc/alertmanager/alertmanager.yml"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  node-exporter:
    <<: *common
    image: "${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.12.1}"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --web.listen-address=0.0.0.0:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - "${NODE_EXPORTER_TEXTFILE_DIR:-/var/lib/node_exporter/textfile_collector}:/textfile:ro"
    expose: ["9100"]
    networks:
      monitoring: {}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.03
    pids_limit: 32

  cadvisor:
    <<: *common
    image: "${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:v0.60.5}"
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=35s
      - --event_storage_event_limit=default=0
      - --event_storage_age_limit=default=0
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose: ["8080"]
    networks:
      monitoring: {}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.10
    pids_limit: 128

  postgres-exporter:
    <<: *common
    image: "${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:v0.20.1}"
    environment:
      DATA_SOURCE_URI: postgres:5432/odirag?sslmode=disable
      DATA_SOURCE_USER: odirag_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_exporter_password
    secrets:
      - postgres_exporter_password
    command:
      - --web.listen-address=:9187
      - --log.level=warn
    expose: ["9187"]
    networks:
      app-private: {}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.03
    pids_limit: 32

  redis-exporter:
    <<: *common
    image: "${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.89.0}"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_exporter_password
    secrets:
      - redis_exporter_password
    expose: ["9121"]
    networks:
      app-private: {}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.03
    pids_limit: 32

  blackbox-exporter:
    <<: *common
    image: "${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.28.0}"
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
      - --web.listen-address=:9115
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    expose: ["9115"]
    networks:
      monitoring: {}
      app-private: {}
      app-edge: {}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.04
    pids_limit: 64

secrets:
  grafana_admin_password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:-/etc/odirag/monitoring/grafana_admin_password}"
  redis_exporter_password:
    file: "${REDIS_EXPORTER_PASSWORD_FILE:-/etc/odirag/monitoring/redis_exporter_password}"
  postgres_exporter_password:
    file: "${POSTGRES_EXPORTER_PASSWORD_FILE:-/etc/odirag/monitoring/postgres_exporter_password}"

volumes:
  prometheus-data:
    name: odirag-monitoring-prometheus
  grafana-data:
    name: odirag-monitoring-grafana
  alertmanager-data:
    name: odirag-monitoring-alertmanager

networks:
  monitoring:
    name: odirag-monitoring
    driver: bridge
    internal: true
  management:
    name: odirag-monitoring-management
    driver: bridge
  app-private:
    name: odirag-prod-private
    external: true
  app-edge:
    name: odirag-prod-edge
    external: true
