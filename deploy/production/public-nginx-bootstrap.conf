server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rag.suzheodirag.top;

    server_tokens off;
    access_log /var/log/nginx/odirag_acme_access.log;
    error_log /var/log/nginx/odirag_acme_error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
