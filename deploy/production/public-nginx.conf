map $http_upgrade $odirag_connection_upgrade {
    default upgrade;
    '' close;
}

upstream odirag_internal_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

log_format odirag_public_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"host":"$host","user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 444;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name rag.suzheodirag.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://rag.suzheodirag.top$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/rag.suzheodirag.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.suzheodirag.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ODIRAGSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rag.suzheodirag.top;

    ssl_certificate /etc/letsencrypt/live/rag.suzheodirag.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.suzheodirag.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ODIRAGSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;
    access_log /var/log/nginx/odirag_access.log odirag_public_json;
    error_log /var/log/nginx/odirag_error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location / {
        proxy_pass http://odirag_internal_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $odirag_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
