[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odirag-backend"
version = "0.1.0"
description = "Official Document Intelligence and RAG backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "greenlet>=3.0,<4",
  "httpx>=0.27,<1",
  "lxml>=5.3,<7",
  "numpy>=1.26,<2.3",
  "openpyxl>=3.1,<4",
  "passlib[bcrypt]>=1.7.4,<2",
  "psycopg[binary]>=3.2,<4",
  "PyMuPDF>=1.24,<2",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "qdrant-client>=1.11,<2",
  "rank-bm25>=0.2.2,<1",
  "redis>=5.0,<6",
  "sqlalchemy>=2.0.35,<3",
  "structlog>=24.4,<26",
  "tenacity>=9.0,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "black>=24.8,<26",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require infrastructure",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unused_ignores = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "openpyxl", "openpyxl.*", "passlib.*", "rank_bm25"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
