hard_minimum_chars: 40
soft_minimum_chars: 180
accept_score: 0.65
reject_score: 0.25
title_reject_patterns:
  - '(?i)test page|page not found'
content_reject_patterns:
  - '(?i)access denied|captcha required'
relevance_keywords:
  - policy
  - regulation
  - notice
  - support
  - application
  - '\u653f\u7b56'
  - '\u901a\u77e5'
  - '\u529e\u6cd5'
short_content_penalty: 0.35
missing_keyword_penalty: 0.25
unofficial_source_penalty: 0.1
