version: 1
sources:
  - source_key: gov-cn-latest
    name: China Government Latest Policies
    domain: www.gov.cn
    region: national
    organization_level: national
    organization_type: government
    official_status: official
    homepage_url: https://www.gov.cn/
    enabled: true
    priority: 100
    crawl_frequency: daily
    columns:
      - column_key: latest-policies
        column_name: Latest policies
        column_url: https://www.gov.cn/zhengce/zuixin/ZUIXINZHENGCE.json
        parser_type: govcn_latest_json
        enabled: true
        max_pages: 1
        request_interval_seconds: 1
        selectors_json:
          title: h1
          content: .pages_content, .article, '#UCAP-CONTENT'
          publish_date: .pages-date, .time, .pub_border
          attachment: a[href]
        pagination_json:
          page_size: 20
