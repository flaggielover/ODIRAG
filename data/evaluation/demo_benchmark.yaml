  - document_id: demo-policy-research-2026
    title: Software Research and Innovation Support Measures
    source_url: https://demo.gov.example/policies/research-2026
    publish_date: 2026-02-01
    issuing_authority: Demo Government Policy Office
    document_number: DEMO-2026-01
    region: Sichuan
    document_type: industry_policy
    content: |
      # Support measures

      Eligible software companies can apply for research funding and innovation grants.

      # Application requirements

      Applicants must submit a project plan and an audited research budget.
