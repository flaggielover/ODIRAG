name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier (for example v0.1.0-r1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock

      - name: Install and validate backend
        working-directory: backend
        run: |
          python -m pip install --constraint requirements.lock -e ".[dev]"
          python -m ruff check .
          python -m black --check .
          python -m mypy app
          python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Validate deployment configuration
        shell: bash
        run: |
          find deployment deploy/production scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          docker compose config --quiet
          docker compose --env-file deploy/production/.env.example \
            --file deploy/production/compose.yml config --quiet
          docker compose --env-file deploy/production/monitoring/.env.example \
            --file deploy/production/monitoring/compose.yml config --quiet

  publish:
    name: Publish ${{ matrix.component }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
            image: odirag-backend
          - component: frontend
            dockerfile: Dockerfile.frontend
            image: odirag-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release identity
        id: identity
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release_id }}
        run: |
          release_id="$REQUESTED_RELEASE"
          if [[ -z "$release_id" ]]; then
            release_id="$GITHUB_REF_NAME"
          fi
          [[ "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'created=%s\n' "$created" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.identity.outputs.image }}
          tags: |
            type=raw,value=${{ steps.identity.outputs.release_id }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.release_id }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ODIRAG_SOURCE_REVISION=${{ github.sha }}
            ODIRAG_RELEASE=${{ steps.identity.outputs.release_id }}
            ODIRAG_BUILD_CREATED=${{ steps.identity.outputs.created }}
            ODIRAG_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.identity.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false

      - name: Validate and checksum SBOM
        shell: bash
        run: |
          jq -e '.spdxVersion and (.packages | type == "array")' \
            sbom-${{ matrix.component }}.spdx.json >/dev/null
          sha256sum sbom-${{ matrix.component }}.spdx.json \
            > sbom-${{ matrix.component }}.spdx.json.sha256
          printf 'image=%s@%s\n' \
            '${{ steps.identity.outputs.image }}' '${{ steps.build.outputs.digest }}'

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.component }}-${{ steps.identity.outputs.release_id }}
          path: |
            sbom-${{ matrix.component }}.spdx.json
            sbom-${{ matrix.component }}.spdx.json.sha256
          if-no-files-found: error
          retention-days: 30
