name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier (for example v0.1.0-r1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.lock

      - name: Install and validate backend
        working-directory: backend
        run: |
          python -m pip install --only-binary=:all: --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python -m ruff check .
          python -m black --check .
          python -m mypy app
          python -m pytest
          python -m pytest -p no:cacheprovider ../deploy/production/tests/test_release_integrity.py -q

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run type-check
          npm test
          npm run build

      - name: Validate deployment configuration
        shell: bash
        run: |
          find deployment deploy/production scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/src,readonly" \
            debian:bookworm-slim \
            bash -c '
              set -Eeuo pipefail
              mkdir -p /tmp/odirag-source
              cp -R /src/deploy /tmp/odirag-source/
              cd /tmp/odirag-source
              bash deploy/production/tests/test-release-lifecycle.sh
            '
          docker compose config --quiet
          docker compose --env-file deploy/production/.env.example \
            --file deploy/production/compose.yml config --quiet
          docker compose --env-file deploy/production/monitoring/.env.example \
            --file deploy/production/monitoring/compose.yml config --quiet

  publish:
    name: Publish ${{ matrix.component }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            dockerfile: Dockerfile.backend
            image: odirag-backend
          - component: frontend
            dockerfile: Dockerfile.frontend
            image: odirag-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release identity
        id: identity
        shell: bash
        env:
          REQUESTED_RELEASE: ${{ inputs.release_id }}
        run: |
          release_id="$REQUESTED_RELEASE"
          if [[ -z "$release_id" ]]; then
            release_id="$GITHUB_REF_NAME"
          fi
          [[ "$release_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          {
            printf 'release_id=%s\n' "$release_id"
            printf 'image=%s\n' "$image"
            printf 'created=%s\n' "$created"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce immutable release tag
        shell: bash
        run: |
          set +e
          inspect_output="$(docker buildx imagetools inspect \
            '${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.release_id }}' \
            2>&1)"
          inspect_status=$?
          set -e
          if [[ "$inspect_status" -eq 0 ]]; then
            printf '::error::Release tag already exists and will not be overwritten: %s:%s\n' \
              '${{ steps.identity.outputs.image }}' '${{ steps.identity.outputs.release_id }}'
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|name unknown|not found' <<<"$inspect_output"; then
            printf '::error::Unable to prove that the release tag is absent; refusing to publish.\n'
            exit 1
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.identity.outputs.image }}
          tags: |
            type=raw,value=${{ steps.identity.outputs.release_id }}
            type=raw,value=sha-${{ github.sha }}-${{ steps.identity.outputs.release_id }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.release_id }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ODIRAG_SOURCE_REVISION=${{ github.sha }}
            ODIRAG_RELEASE=${{ steps.identity.outputs.release_id }}
            ODIRAG_BUILD_CREATED=${{ steps.identity.outputs.created }}
            ODIRAG_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Verify registry pull, digest, and BuildKit attestations
        shell: bash
        run: |
          image='${{ steps.identity.outputs.image }}'
          release_id='${{ steps.identity.outputs.release_id }}'
          expected_digest='${{ steps.build.outputs.digest }}'
          registry_digest="sha256:$(
            docker buildx imagetools inspect "$image:$release_id" --raw \
              | sha256sum | cut -d' ' -f1
          )"
          [[ "$registry_digest" == "$expected_digest" ]]
          docker pull --platform linux/amd64 "$image@$expected_digest"
          docker image inspect "$image@$expected_digest" >/dev/null
          docker buildx imagetools inspect "$image@$expected_digest" \
            --format '{{ json .Provenance.SLSA }}' \
            | jq -e 'type == "object" and length > 0' >/dev/null
          docker buildx imagetools inspect "$image@$expected_digest" \
            --format '{{ json .SBOM.SPDX }}' \
            | jq -e 'type == "object" and .spdxVersion' >/dev/null
          printf 'verified_image=%s@%s\n' "$image" "$expected_digest"

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate and checksum SBOM
        shell: bash
        run: |
          jq -e '.spdxVersion and (.packages | type == "array")' \
            sbom-${{ matrix.component }}.spdx.json >/dev/null
          sha256sum sbom-${{ matrix.component }}.spdx.json \
            > sbom-${{ matrix.component }}.spdx.json.sha256
          printf 'image=%s@%s\n' \
            '${{ steps.identity.outputs.image }}' '${{ steps.build.outputs.digest }}'

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component }}-${{ steps.identity.outputs.release_id }}
          path: |
            sbom-${{ matrix.component }}.spdx.json
            sbom-${{ matrix.component }}.spdx.json.sha256
          if-no-files-found: error
          retention-days: 30
