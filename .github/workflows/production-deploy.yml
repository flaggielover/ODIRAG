name: Production Release Deployment

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Installed immutable release identifier
        required: true
        type: string
      operation:
        description: Release transaction operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

permissions:
  contents: read
  packages: read

concurrency:
  group: odirag-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy immutable production release
    runs-on: [self-hosted, linux, x64, odirag-production-deploy]
    timeout-minutes: 30
    steps:
      - name: Validate release identity and privilege
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]]
          [[ "$OPERATION" == "deploy" || "$OPERATION" == "rollback" ]]
          target="/opt/odirag/releases/$RELEASE_ID"
          [[ -d "$target" && ! -L "$target" ]]
          sudo -n true
          manifest_id="$(sudo sed -nE 's/^ODIRAG_RELEASE_ID=//p' "$target/manifest.env")"
          [[ "$manifest_id" == "$RELEASE_ID" ]]
          if [[ "$OPERATION" == "rollback" ]]; then
            current="$(sudo realpath -e /opt/odirag/current)"
            previous="$(sudo realpath -e /opt/odirag/previous)"
            [[ "$current" == /opt/odirag/releases/* && "$current" != "$target" ]]
            [[ "$previous" == "$target" ]]
            [[ -x "$current/deploy/production/scripts/deploy-release.sh" ]]
            [[ "$(sudo stat -c '%u:%a:%F' "$target/deployment-state.json")" \
                == '0:444:regular file' ]]
            sudo python3 - "$target/deployment-state.json" "$RELEASE_ID" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          if state.get("release_id") != sys.argv[2]:
              raise SystemExit("rollback target state release mismatch")
          if state.get("data_integrity_verified") is not True:
              raise SystemExit("rollback target data integrity was not verified")
          if state.get("providers_verified") is not True:
              raise SystemExit("rollback target providers were not verified")
          PY
          fi
          printf 'production_release_preflight=PASS-CONFIG release=%s operation=%s\n' \
            "$RELEASE_ID" "$OPERATION"

      - name: Pull, deploy, and verify immutable release
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -Eeuo pipefail
          auth_root="/run/odirag-ghcr-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="/opt/odirag/releases/$RELEASE_ID"
          cleanup() {
            sudo env DOCKER_CONFIG="$auth_root" docker logout ghcr.io >/dev/null 2>&1 || true
            sudo rm -f -- "$auth_root/config.json"
            sudo rmdir -- "$auth_root" 2>/dev/null || true
          }
          if sudo test -e "$auth_root" || sudo test -L "$auth_root"; then
            printf 'temporary auth directory already exists\n' >&2
            exit 1
          fi
          sudo install -d -o root -g root -m 0700 "$auth_root"
          [[ "$(sudo stat -c '%u:%a:%F' "$auth_root")" == '0:700:directory' ]]
          trap cleanup EXIT

          printf '%s' "$GHCR_TOKEN" \
            | sudo env DOCKER_CONFIG="$auth_root" \
                docker login ghcr.io --username "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN

          transaction_script="$target/deploy/production/scripts/deploy-release.sh"
          if [[ "$OPERATION" == "rollback" ]]; then
            current="$(sudo realpath -e /opt/odirag/current)"
            transaction_script="$current/deploy/production/scripts/deploy-release.sh"
          fi
          sudo env DOCKER_CONFIG="$auth_root" \
            "$transaction_script" "$target" "$OPERATION"
          sudo "$target/deploy/production/scripts/verify-release.sh" \
            "$target" --providers
          printf 'production_release_deployment=PASS-LIVE release=%s operation=%s\n' \
            "$RELEASE_ID" "$OPERATION"
